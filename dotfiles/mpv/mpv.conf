# ==============================================================================
# MPV Configuration — Optimized for Panasonic Toughbook CF-SV8
# Hardware: Intel Core i7-8665U (Intel UHD Graphics 620, 24 EUs)
# Display: 12.1" 1920x1200 (16:10), X11 + DWM
# ==============================================================================

# ── 1. 视频输出与硬件加速 (VA-API + Intel QuickSync) ─────────────────────────
vo=gpu-next
gpu-api=opengl
hwdec=auto-safe                     # 优先 VA-API 硬件解码，保障极低 CPU 占用与电池续航
hwdec-codecs=all

# ── 2. DWM 平铺桌面窗口集成 ──────────────────────────────────────────────────
keepaspect=yes                      # 严格保持视频原始宽高比
autofit-larger=75%x75%              # 初始窗口大小不超过屏幕的 75%，防止铺满遮挡
geometry=50%:50%                    # 启动时位于屏幕正中央 (搭配 DWM isfloating 规则)
cursor-autohide=1000                # 鼠标静止 1 秒后自动隐藏光标
cursor-autohide-fs-only=no

# ── 3. 画面品质优化 (Intel UHD 620 甜点调校) ──────────────────────────────────
# 缩放算法：Spline36 带来清晰锐利的线条，核显占用仅 20% 左右，兼顾极高画质与超低功耗
scale=spline36
cscale=spline36
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
dither-depth=auto

# 抗色带滤镜 (Deband)：有效平滑动画与暗场的色彩断层
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=5

# ── 4. 音频输出配置 (PipeWire 原生联动) ───────────────────────────────────────
ao=pipewire,pulse
audio-pitch-correction=yes          # 变速播放时自动保持音调正常，不出现尖锐变调
volume=100
volume-max=150

# ── 5. 字幕渲染与中文字体支持 ────────────────────────────────────────────────
sub-auto=fuzzy                      # 自动模糊加载同名外挂字幕 (如 .srt / .ass)
sub-font="Noto Sans CJK SC"         # 绑定系统思源黑体，杜绝中文方块/豆腐块乱码
sub-font-size=44
sub-border-size=2.4
sub-border-color="#FF1E1E2E"        # Catppuccin Mocha 风格深色轮廓描边
sub-shadow-offset=1.5
sub-shadow-color="#80000000"
slang=zh,chi,chs,sc,en              # 优先选择中文字幕
alang=ja,jp,jpn,zh,chi,en           # 优先选择原声/日语/中文音频

# ── 6. 播放历史与状态记忆 ────────────────────────────────────────────────────
save-position-on-quit=yes           # 退出时记住播放进度，下次打开秒级断点续播
keep-open=yes                       # 播放完毕后停在最后一帧，不自动闪退

# ── 7. 截图功能定制 (指定格式与归档路径) ─────────────────────────────────────
screenshot-format=png               # 截取无损高质量 PNG
screenshot-png-compression=7
screenshot-directory="~/Pictures/mpv"
screenshot-template="%F_%P_%02n"    # 文件名：[视频名]_[时间戳]_[序号].png
screenshot-tag-colorspace=yes

# ── 8. 原生控制条 (OSC) 细节打磨 ─────────────────────────────────────────────
osc=yes
osd-font="Noto Sans CJK SC"
osd-font-size=28
osd-duration=1500
osd-on-seek=msg-bar

# ── 9. 高码率与 4K 自适应保护规则 (防掉帧) ───────────────────────────────────
# 当视频分辨率高于 1440p (如 4K 片源) 时，自动将缩放算法降级为双线性，关闭重度 deband
# 确保在核显性能边界内绝对流畅、不发生 Frame Drop
[high-res]
profile-cond=width >= 2560 or height >= 1440
scale=bilinear
cscale=bilinear
deband=no
